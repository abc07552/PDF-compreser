name: Verify studio and build Android
on:
  push:
    branches: [main, 'arena/**']
    paths-ignore: ['docs/**', 'deliverables/**', '**.md']
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Install the browser pinned by Playwright
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('BROWSER_EXECUTABLE='+require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - run: npm test
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: browser-test-diagnostics, path: test-results/, retention-days: 3 }
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - name: Prepare the Android SDK on the hosted runner
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm run android:sync
      - name: Compile, lint, and exercise release shrinking
        working-directory: android
        run: ./gradlew --no-daemon :app:lintRelease :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with: { name: PDF-Reducer-ULTRA-V6-debug-APK, path: android/app/build/outputs/apk/debug/app-debug.apk }
  device:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - name: Prepare the Android SDK on the hosted runner
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm run android:sync
      - name: Select a stable Google APIs image compatible with hosted KVM
        id: image
        run: |
          echo "STUDIO_BUILD_JAVA=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "STUDIO_SDK_JAVA=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --list > "$RUNNER_TEMP/available-sdk-images.txt"
          python3 - <<'PYTHON'
          import os, pathlib, re
          listing=(pathlib.Path(os.environ['RUNNER_TEMP'])/'available-sdk-images.txt').read_text()
          # Recent packages use dotted API IDs and may have a 16 KiB image tag.
          images=set(re.findall(r'system-images;android-(\d+(?:\.\d+)?);(google_apis(?:_playstore)?(?:_ps16k)?);x86_64(?=\s|\|)',listing))
          # The 37.2 ps16k-only image did not boot on hosted KVM. Do not
          # substitute a skipped UI test for a pass or lower the app's WebView floor.
          images=[(v,t) for v,t in images if int(v.split('.')[0])>=36 and t=='google_apis']
          if not images: raise SystemExit('No standard stable Google APIs x86_64 image is available.')
          level,tag=max(images,key=lambda a:tuple(map(int,a[0].split('.'))))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: print(f'api={level}\ntag={tag}',file=f)
          print(f'::notice::Selected system-images;android-{level};{tag};x86_64 from the stable SDK channel. Build platform remains API 36.')
          PYTHON
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          JAVA_HOME: ${{ env.STUDIO_SDK_JAVA }}
        with:
          api-level: 36
          system-image-api-level: ${{ steps.image.outputs.api }}
          target: ${{ steps.image.outputs.tag }}
          arch: x86_64
          disable-animations: true
          script: bash scripts/verify-device.sh
      - name: Report executed device tests (a skipped WebView smoke is not a pass)
        if: always()
        run: |
          python3 - <<'PYTHON'
          import pathlib, xml.etree.ElementTree as ET
          files=list(pathlib.Path('android/app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'))
          if not files: print('::warning::No emulator test report was produced.')
          for f in files:
              for t in ET.parse(f).iter('testcase'):
                  state='SKIPPED' if t.find('skipped') is not None else 'FAILED' if t.find('failure') is not None or t.find('error') is not None else 'PASSED'
                  print(f"::notice::Android {state}: {t.get('classname')}.{t.get('name')}")
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: V6-emulator-test-reports, path: android/app/build/outputs/androidTest-results/connected/, if-no-files-found: ignore }
